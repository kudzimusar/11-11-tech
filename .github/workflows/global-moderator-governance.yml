name: Global Moderator Governance Integrity
on:
  pull_request:
    paths:
      - 'governance/global-moderator/**'
      - 'skills/11-11-global-moderator/**'
      - '.github/workflows/global-moderator-governance.yml'
  push:
    branches: [main]
    paths:
      - 'governance/global-moderator/**'
      - 'skills/11-11-global-moderator/**'
      - '.github/workflows/global-moderator-governance.yml'

permissions:
  contents: read

jobs:
  verify-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate global standard, links and handoff schema
        run: node governance/global-moderator/validate.mjs
