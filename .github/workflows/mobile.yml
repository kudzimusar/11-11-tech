name: Native mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'package.json'
      - '.github/workflows/mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'package.json'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'

      - name: Install native dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Expo doctor
        run: npm run doctor

      - name: Export web smoke build
        run: npm run export:web
