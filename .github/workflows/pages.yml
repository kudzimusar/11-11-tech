name: Deploy 11-11 Tech to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_LEAD_API_URL: https://aopwqtlxxqdlfftpcvwv.supabase.co/functions/v1/lead-intake

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/work/index.html
          test -f dist/capabilities/index.html
          test -f dist/capabilities/ui-ux/index.html
          test -f dist/capabilities/enterprise/index.html
          test -f dist/capabilities/ai/index.html
          test -f dist/capabilities/software-data-cloud/index.html
          test -f dist/capabilities/transformation/index.html
          test -f dist/capabilities/talent/index.html
          test -f dist/capabilities/trust/index.html
          test -f dist/services/index.html
          test -f dist/solutions/index.html
          test -f dist/industries/index.html
          test -f dist/pricing/index.html
          test -f dist/trust/index.html
          test -f dist/insights/index.html
          test -f dist/about/index.html
          test -f dist/vision/index.html
          test -f dist/method/index.html
          test -f dist/contact/index.html
          test -f dist/policies/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/site.webmanifest
          test -f dist/sw.js
          test -f dist/.well-known/security.txt
          test -f dist/assets/icon-192.png
          test -f dist/assets/icon-512.png
          grep -q "Content-Security-Policy" dist/index.html
          grep -q "11-11 Tech" dist/index.html
          grep -q "UI/UX & Front-End Engineering" dist/capabilities/ui-ux/index.html
          grep -q "Trust Center" dist/trust/index.html
          grep -q "aopwqtlxxqdlfftpcvwv.supabase.co" dist/index.html
          grep -R -q "aopwqtlxxqdlfftpcvwv.supabase.co/functions/v1/lead-intake" dist/assets

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
